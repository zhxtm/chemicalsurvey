name: Build APK 化学智勘·外业采集

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ubuntu-latest 自带 Android SDK（~/.android-sdk），直接用
      - name: Set Android SDK env vars
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls $ANDROID_HOME/platforms/
          ls $ANDROID_HOME/build-tools/
        env:
          ANDROID_HOME: ${{ runner.os == 'Linux' && '/usr/local/lib/android/sdk' || 'C:/Android/Sdk' }}

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite static site
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android 2>&1 || echo "android platform already exists"

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemical-survey-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
