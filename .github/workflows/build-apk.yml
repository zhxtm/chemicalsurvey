name: Build APK 化学智勘·外业采集

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        env:
          ANDROID_HOME: ${{ runner.os == 'Linux' && '/usr/local/lib/android/sdk' || 'C:/Android/Sdk' }}

      - name: npm ci + build
        run: |
          npm ci
          npm run build

      # android/ 平台已预先 commit，手动复制 web 资源过去
      - name: Copy web assets (skip capacitor CLI)
        run: |
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "--- copied assets ---"
          ls android/app/src/main/assets/public/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: chemical-survey-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
